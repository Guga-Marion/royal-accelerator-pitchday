<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
:root{--navy:#08132B;--gold:#C2922A;--gold-dp:#A87C18;--ink-2:#394561;--ink-3:#6B7591;--rule:#E2D9C4}
body{width:560px;height:150px;background:#FFFFFF;display:flex;align-items:center;padding:0 26px;
     font-family:"Inter",-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{display:flex;align-items:center;gap:24px;width:100%}
.brand{flex:none;width:158px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.emb{width:46px;height:46px}
.wm{display:flex;flex-direction:column;line-height:1.0}
.wm b{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:21px;color:var(--navy);letter-spacing:.01em}
.wm i{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;font-size:21px;color:var(--navy)}
.bar{flex:none;width:1px;align-self:stretch;margin:14px 0;
     background:linear-gradient(180deg,rgba(194,146,42,0) 0%,var(--gold) 22%,var(--gold) 78%,rgba(194,146,42,0) 100%)}
.info{flex:1;min-width:0;display:flex;flex-direction:column}
.nm{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:27px;line-height:1.05;color:var(--navy);letter-spacing:.005em}
.rl{margin-top:5px;font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-weight:600;font-size:8.5px;
    letter-spacing:.19em;text-transform:uppercase;color:var(--gold-dp)}
.hr{margin:11px 0 10px;height:1px;background:var(--rule);width:100%}
.ct{font-size:10.5px;line-height:1.62;color:var(--ink-2);font-weight:500}
.ct a{color:var(--ink-2);text-decoration:none}
.ad{margin-top:3px;font-size:9.5px;line-height:1.55;color:var(--ink-3);font-weight:400}
</style></head><body>
<div class="wrap">
  <div class="brand">
    <svg class="emb" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="45" stroke="#08132B" stroke-width="1.6"/><circle cx="50" cy="50" r="39" stroke="#08132B" stroke-width=".8" opacity=".55"/><path d="M29 60 V51 L38 43 L44 49 L53 38 L59 44 L71 29 V60 Z" stroke="#08132B" stroke-width="1.8" stroke-linejoin="round"/><rect x="29" y="63.5" width="42" height="3" rx="1.5" fill="#08132B"/></svg>
    <div class="wm"><b>Royal Business</b><i>Growth</i></div>
  </div>
  <div class="bar"></div>
  <div class="info">
    <div class="nm">Guga Marion</div>
    <div class="rl">Managing Partner</div>
    <div class="hr"></div>
    <div class="ct">guga@rbg-hub.com &nbsp;·&nbsp; www.rbg-hub.com</div>
    <div class="ad">2121 S Hiawassee Rd, Ste 120 · Orlando, FL 32835 · United States</div>
  </div>
</div>
</body></html>
