<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1800px;height:1000px;background:#08132B;font-family:"JetBrains Mono",monospace;color:#A9B4D0;padding:50px}
h1{font-family:"Cormorant Garamond",serif;color:#F5F2E8;font-weight:600;font-size:34px;margin-bottom:26px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:30px}
.c{border:1px solid #1D2C50;padding:26px;display:flex;flex-direction:column;gap:18px}
.c .k{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#D4A437;min-height:30px}
.row{display:flex;align-items:center;gap:22px}
.big{width:260px;height:260px}
.sm{width:64px;height:64px}
.xs{width:28px;height:28px}
.sand{background:#F6F2E9;padding:16px;display:flex;gap:16px;align-items:center}
.ig{width:110px;height:110px;border-radius:50%;background:radial-gradient(70% 70% at 50% 40%,#16295A,#08132B);display:flex;align-items:center;justify-content:center}
.ig svg{width:80px;height:80px}
.wm{display:flex;align-items:center;gap:18px;margin-top:30px}
.wm .t{display:flex;flex-direction:column;line-height:1;font-family:"Cormorant Garamond",serif;font-weight:600;font-size:40px;color:#F5F2E8}
</style></head><body>
<h1>RBG · emblema v3 · rodada 3 · refinando F</h1>
<div class="g" id="g"></div>
<div class="wm" id="wm"></div>
<script>
const G='<linearGradient id="gg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#C2922A"/><stop offset=".55" stop-color="#D4A437"/><stop offset="1" stop-color="#F0C44D"/></linearGradient>';
const marks=[
 ['F1 · retas · pontas colineares (40/30/20)',
  '<path d="M22 70 L31 40 L40 70 Z M40 70 L49 30 L58 70 Z M58 70 L67 20 L78 70 Z"/><rect x="22" y="73.5" width="56" height="6.5"/>'],
 ['F2 · lados côncavos · heráldica',
  '<path d="M22 70 Q27 58 31 40 Q35 58 40 70 Z M40 70 Q45 55 49 30 Q53 55 58 70 Z M58 70 Q63 50 67 20 Q72 50 78 70 Z"/><rect x="22" y="73.5" width="56" height="6.5"/>'],
 ['F3 · retas · fendas de 1.5 entre pontas',
  '<path d="M22 70 L30.5 40 L39 70 Z M41 70 L49.5 30 L58 70 Z M60 70 L68 20 L78 70 Z"/><rect x="22" y="73.5" width="56" height="6.5"/>'],
 ['F4 · côncavo + faixa alta + anel duplo',
  '<path d="M22 68 Q27 56 31 38 Q35 56 40 68 Z M40 68 Q45 53 49 28 Q53 53 58 68 Z M58 68 Q63 48 67 18 Q72 48 78 68 Z"/><rect x="22" y="72" width="56" height="8"/>'],
];
const ring=(c,w,d)=>`<circle cx="50" cy="50" r="46" fill="none" stroke="${c}" stroke-width="${w}"/>`+(d?`<circle cx="50" cy="50" r="42.5" fill="none" stroke="${c}" stroke-width="${w*0.45}" opacity=".7"/>`:'');
const svg=(cls,fill,body,r)=>`<svg class="${cls}" viewBox="0 0 100 100"><defs>${G}</defs>${r||''}<g fill="${fill}">${body}</g></svg>`;
document.getElementById('g').innerHTML=marks.map(([k,b],i)=>`<div class="c"><span class="k">${k}</span>
 ${svg('big','url(#gg)',b,ring('#D4A437',1.2,i==3))}
 <div class="row">${svg('sm','#D4A437',b,ring('#D4A437',1.6,i==3))}${svg('xs','#D4A437',b)}<div class="sand">${svg('sm','#08132B',b,ring('#08132B',1.6,i==3))}</div></div>
 <div class="row"><div class="ig">${svg('','#D4A437',b)}</div><div class="ig">${svg('','#F5F2E8',b)}</div></div>
</div>`).join('');
document.getElementById('wm').innerHTML=svg('sm','#D4A437',marks[1][1],ring('#D4A437',1.6))+'<div class="t"><span>Royal Business</span><i>Growth</i></div>'+
 '<div style="width:60px"></div>'+svg('sm','#D4A437',marks[3][1],ring('#D4A437',1.6,true))+'<div class="t"><span>Royal Business</span><i>Growth</i></div>';
</script>
</body></html>
