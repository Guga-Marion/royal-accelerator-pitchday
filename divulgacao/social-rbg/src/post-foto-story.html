<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:Inter,sans-serif;overflow:hidden;background:#08132B}
.board{position:relative;overflow:hidden;color:#fff}
.ph{position:absolute;inset:0;object-fit:cover;width:100%;height:100%}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,19,43,.62) 0%,rgba(8,19,43,.08) 34%,rgba(8,19,43,.05) 52%,rgba(8,19,43,.88) 82%,rgba(7,14,34,.96) 100%)}
.veil2{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 42%,transparent 55%,rgba(8,19,43,.55) 100%)}
.frame{position:absolute;border:1.5px solid rgba(212,164,55,.55);pointer-events:none}
.lock{display:flex;align-items:center;gap:18px}
.lock .emb{flex:none}
.lk1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;color:#fff;line-height:1.02;letter-spacing:.01em}
.lk2{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;color:#E9B73C;line-height:1.02}
.eb{font-family:"JetBrains Mono",monospace;text-transform:uppercase;color:#F0C44D;font-weight:600}
.tt{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;line-height:1.04;letter-spacing:-.01em}
.tt em{font-style:italic;color:#F0C44D}
.foot{font-family:"JetBrains Mono",monospace;text-transform:uppercase;color:#9AA6C4;font-weight:500}
.foot b{color:#F0C44D;font-weight:600}</style>
<style>.board{width:1080px;height:1920px}
.ph{object-position:50% 46%}
.frame{inset:40px}
.top{position:absolute;top:120px;left:0;right:0;display:flex;justify-content:center}
.lock{flex-direction:column;gap:22px;text-align:center}
.lock .emb{width:110px;height:110px}.lk1,.lk2{font-size:34px}
.low{position:absolute;left:84px;right:84px;bottom:220px;text-align:center}
.eb{font-size:17px;letter-spacing:.32em;justify-content:center;display:flex;align-items:center;gap:16px;margin-bottom:24px}
.eb::before,.eb::after{content:"";width:36px;height:1px;background:rgba(240,196,77,.7)}
.tt{font-size:88px}
.foot{position:absolute;left:0;right:0;bottom:120px;text-align:center;font-size:13.5px;letter-spacing:.2em}
</style></head><body>
<div class="board">
  <img class="ph" src="../../../assets/palestra/rio-innovation.jpg" alt="">
  <div class="veil"></div><div class="veil2"></div>
  <div class="frame"></div>
  <div class="top"><div class="lock"><svg class="emb" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="45" stroke="#D4A437" stroke-width="2"/><circle cx="50" cy="50" r="39" stroke="rgba(212,164,55,.35)" stroke-width="1"/><path d="M29 60v-9l9-8 6 6 9-10 6 6 12-14v29z" stroke="#F0C44D" stroke-width="2.4" stroke-linejoin="round"/><rect x="29" y="63.5" width="42" height="3.4" rx="1.3" fill="#F0C44D"/></svg><div><span class="lk1">Royal Business</span> <span class="lk2">Growth</span></div></div></div>
  <div class="low">
    <div class="eb">Orlando · Flórida</div>
    <div class="tt">O ecossistema que <em>acelera</em> empresas brasileiras nos EUA.</div>
  </div>
  <div class="foot"><b>royalbusinessgrowth</b></div>
</div>
</body></html>
