<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_social-base.css">
<style>
.board{width:1128px;height:191px}
.frame{position:absolute;inset:12px;border:1px solid rgba(212,164,55,.26);border-radius:8px}
/* zona livre à esquerda: o logo da página sobrepõe até ~x=210 */
.cont{position:absolute;left:246px;right:36px;top:0;bottom:0;display:flex;align-items:center;gap:28px;z-index:2}
.lock{display:flex;align-items:center;gap:14px;flex:none}
.lock .emb{width:62px;height:62px;flex:none}
.lock .txt{display:flex;flex-direction:column;text-align:left}
.lock .lk1{font-size:28px}
.lock .lk2{font-size:28px}
.vr{width:1px;align-self:stretch;margin:44px 0;background:linear-gradient(180deg,transparent,rgba(212,164,55,.5),transparent);flex:none}
.right{display:flex;flex-direction:column;gap:9px}
.line{white-space:nowrap;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:27px;color:#EDF1F9;line-height:1.12}
.line b{font-style:normal;font-weight:700;
  background:linear-gradient(180deg,#F4D06A,#D4A437);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.kick{white-space:nowrap;font-size:11px;letter-spacing:.22em;display:flex;align-items:center;gap:10px}
.kick i{width:3px;height:3px;border-radius:50%;background:rgba(212,164,55,.75);display:inline-block;font-style:normal}
</style></head><body>
<div class="board">
  <div class="frame"></div>
  <div class="cont">
    <div class="lock">
      <svg class="emb" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="45" stroke="#D4A437" stroke-width="1.6"/><circle cx="50" cy="50" r="39" stroke="#D4A437" stroke-width=".8" opacity=".55"/><path d="M29 60 V51 L38 43 L44 49 L53 38 L59 44 L71 29 V60 Z" stroke="#F0C44D" stroke-width="1.8" stroke-linejoin="round"/><rect x="29" y="63.5" width="42" height="3" rx="1.5" fill="#F0C44D"/></svg>
      <div class="txt"><span class="lk1">Royal Business</span><span class="lk2">Growth</span></div>
    </div>
    <div class="vr"></div>
    <div class="right">
      <div class="line">Empresas precisam de <b>estrutura</b> antes de <b>escala</b>.</div>
      <div class="kick">Aceleração <i></i> Venture Building <i></i> Investimento <i></i> Orlando · FL</div>
    </div>
  </div>
</div>
</body></html>
