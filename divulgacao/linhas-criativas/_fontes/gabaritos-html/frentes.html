<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../pitch-day-2/src/fonts.css"><link rel="stylesheet" href="_base.css">
<script src="_rbg.js"></script><script src="_copy.js"></script>
<style>.board{width:1080px;height:1350px}
.top{position:absolute;left:84px;top:84px;z-index:3}
.lock .emb{width:58px;height:58px}.lk1,.lk2{font-size:22px}
.ghost{right:40px;top:150px;font-size:620px}
.mid{position:absolute;left:84px;right:84px;top:330px;z-index:3}
.mid .eb{font-size:16px;margin-bottom:36px}
.k{font-family:"JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.3em;font-size:22px;color:var(--on-2);margin-bottom:22px}
.tt{font-size:128px;max-width:9ch}
.tt.capa{font-size:126px;max-width:11ch}
.tt.cta{font-size:100px;max-width:12ch}
.body{font-size:33px;max-width:22em;margin-top:40px}
.sub{font-size:42px;margin-top:34px;max-width:22em}
.grid{position:absolute;left:84px;bottom:150px;display:flex;gap:12px;z-index:3}
.grid i{width:54px;height:54px;border:1.5px solid rgba(212,164,55,.5);display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--on-3);font-style:normal}
.grid i.on{background:var(--gold-hi);color:var(--navy);border-color:var(--gold-hi);font-weight:600}
.grid i.done{border-color:var(--gold-dp);color:var(--gold-lt)}
.foot{left:84px;right:84px;bottom:74px;font-size:13px;display:flex;justify-content:space-between}
.swipe{position:absolute;right:84px;bottom:160px;font-family:"JetBrains Mono",monospace;font-size:14px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-hi);z-index:3}
.btn{margin-top:56px;display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.pill{height:92px;padding:0 44px;font-size:17px}
.chip{height:56px;padding:0 24px;font-size:20px}
.list{position:absolute;left:84px;right:84px;bottom:230px;display:grid;grid-template-columns:1fr 1fr;gap:14px 40px;z-index:3}
.list div{font-family:Inter,sans-serif;font-size:24px;color:var(--on-2);display:flex;gap:16px;align-items:baseline}
.list b{font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--gold-hi);letter-spacing:.2em}
</style></head><body><div class="board">
  <div class="frame"></div>
  <div class="top"><div class="lock"></div></div>
  <div class="ghost" data-f="n"></div>
  <div class="mid"><div class="eb rule" data-f="eb"></div><div class="k" data-f="k"></div><div class="tt" data-f="t"></div><div class="sub" data-f="s"></div><div class="body" data-f="d"></div><div class="btn" data-f="btn"></div></div>
  <div class="list" data-f="list"></div>
  <div class="grid" data-f="grid"></div>
  <div class="swipe" data-f="swipe"></div>
  <div class="foot"><span data-f="city"></span><b data-f="handle"></b></div>
</div>
<script>
var s=+p('n',1),F=RBG.frentes,I=F.itens,n=I.length,m={city:RBG.city,handle:RBG.handle,k:'',s:'',d:'',btn:'',swipe:'',n:'',list:''};
var g='';I.forEach(function(it,i){g+='<i class="'+(i===s-1?'on':(s>i+1?'done':''))+'">'+it.n+'</i>'});m.grid=g;
if(s===0){m.eb='O método · carrossel';m.t=F.capa.t;m.s=F.capa.s;m.swipe='arraste &nbsp;→';document.querySelector('.tt').classList.add('capa');m.list=I.map(function(it){return '<div><b>'+it.n+'</b>'+it.k+'</div>'}).join('');document.querySelector('.grid').style.display='none';document.querySelector('.mid').style.top='250px'}
else if(s>n){m.eb='O método · como funciona';m.t=F.cta.t;m.btn='<span class="pill solid">'+F.cta.b1+'</span><span class="chip">'+F.cta.s+'</span>';document.querySelector('.tt').classList.add('cta')}
else{var it=I[s-1];m.eb='Sete frentes · '+it.n+' / 07';m.k=it.k;m.t=it.t;m.d=it.d;m.n=it.n}
fill(m);
</script>
</body></html>
