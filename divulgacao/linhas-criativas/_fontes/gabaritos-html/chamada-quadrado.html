<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../pitch-day-2/src/fonts.css"><link rel="stylesheet" href="_base.css">
<script src="_rbg.js"></script><script src="_copy.js"></script>
<style>.board{width:1080px;height:1080px}
.top{position:absolute;left:84px;top:84px;z-index:3}

.chip{height:54px;padding:0 22px;font-size:20px}
.btns{display:flex;gap:16px;margin-top:40px}

    <div class="chips" data-f="chips"></div>
    <div class="btns"><span class="pill solid" data-f="b1"></span></div></div>
  <div class="foot"><span data-f="s"></span><b data-f="site"></b></div>
</div>
<script>var d=RBG.chamada;fill({eb:d.eb,t:d.t,chips:d.chips.map(function(c){return '<span class="chip">'+c+'</span>'}).join(''),b1:d.b1,s:d.s,site:RBG.site});</script>
