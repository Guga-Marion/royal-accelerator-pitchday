<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="base.css">
<style>
body{width:1920px;height:1080px;position:relative}
/* faixa de foto inferior */
.photo{position:absolute;left:0;right:0;bottom:0;height:470px;
  background:url('../../../assets/conselho-pitch-day.jpg') center 66%/cover no-repeat}
.photo::before{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg, var(--navy) 0%, rgba(8,19,43,.55) 20%, rgba(8,19,43,0) 52% 74%, rgba(8,19,43,.82) 100%)}
.photo::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg, rgba(8,19,43,.5), rgba(8,19,43,0) 18% 82%, rgba(8,19,43,.5))}
/* conteúdo superior */
.top{position:absolute;left:0;right:0;top:0;height:130px;padding:46px 96px 0;text-align:center}
.hd{display:flex;justify-content:space-between;align-items:center}
.hd .logo-lock img{height:96px;filter:brightness(1.12)}
.hd .ed{font-family:'JetBrains Mono',monospace;letter-spacing:.34em;color:var(--on-2);
  text-transform:uppercase;font-size:16px;border:1px solid var(--on-rule);padding:.7em 1.3em}
.hd .ed b{color:var(--gold-hi);font-weight:600}
/* bloco de título, baixo, encostado no início da foto */
.titleblock{position:absolute;left:0;right:0;top:430px;text-align:center;z-index:3}
.eb{font-size:18px;display:block}
h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:172px;line-height:.94;margin-top:10px}
h1 .n2{font-style:italic}
.ft{position:absolute;left:0;right:0;bottom:34px;display:flex;justify-content:center;z-index:3}
.ft .foot{font-size:14px;text-shadow:0 2px 14px rgba(8,19,43,.95)}
</style></head><body>
  <div class="photo"></div>
  <div class="top">
    <div class="hd">
      <div class="logo-lock"><img src="logo-rbg-transp.png" alt=""></div>
      <div class="ed">PITCH DAY · <b>2ª EDIÇÃO</b></div>
    </div>
  </div>
  <div class="titleblock">
    <span class="eb">Royal Business Growth · Aceleradora e Venture Capital</span>
    <h1><span class="goldtext">Pitch <span class="n2">Day</span></span></h1>
  </div>
  <div class="ft"><div class="foot"><span>Royal Business Growth</span><span class="dot"></span><b>Royal Accelerator × Deploy US</b></div></div>
</body></html>
